# Full-stack dev compose: Postgres + Django backend + Next.js frontend + Kit (Omniverse).
# Kit runs in a containerized Omniverse environment with Xvfb, x11vnc, and noVNC.
# Backend connects to Kit container via http://kit:8080 (internal DNS).
#
# Usage:
#   docker compose up -d              # start all 3 services
#   docker compose logs -f backend    # follow backend log
#   docker compose down               # stop (keep DB volume)
#   docker compose down -v            # stop + wipe DB volume

name: omniver

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniver_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ran -d ran_dt"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./Omniver-RAN
      dockerfile: Dockerfile
    container_name: omniver_backend
    ports:
      - "${BACKEND_PORT}:8000"              # host:container
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "${DJANGO_DEBUG}"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_SETTINGS_MODULE: main.settings.local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      HTTP_KIT_HOST: ${HTTP_KIT_HOST}                    # reach Kit container via internal DNS
      HTTP_KIT_PORT: "${HTTP_KIT_PORT}"
      WS_KIT_PORT: "${WS_KIT_PORT}"                      # Kit's WS snapshot push port
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_HOST: "0.0.0.0"               # Backend listening address
      BACKEND_PORT: "8000"                  # Backend listening port
    depends_on:
      postgres:
        condition: service_healthy
      kit:
        condition: service_started
    volumes:
      - ./Omniver-RAN:/app                   # live code reload
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: omniver_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${FRONTEND_PORT}:3000"              # host → container 3000
    environment:
      # Browser-side vars — configured via .env
      NEXT_PUBLIC_API_BASE_URL: http://${SERVER_IP}:${BACKEND_PORT}
      NEXT_PUBLIC_WS_URL: ws://${SERVER_IP}:${BACKEND_PORT}/api/v0.1/RAN/UE/live
    volumes:
      - ./frontend:/app                      # live source mount
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    restart: unless-stopped

  kit:
    build:
      context: .
      dockerfile: kit/Dockerfile
    container_name: omniver_kit
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    ports:
      - "8080:8080"   # Kit HTTP API
      - "8081:8081"   # Kit WebSocket snapshot
      - "5900:5900"   # VNC (optional, can be removed)
      - "6080:6080"   # noVNC Web interface
    volumes:
      - /home/mitlab/XAPP_DT/Omnivers_platform:/home/mitlab/XAPP_DT/Omnivers_platform  # access host assets via absolute path
      - /home/mitlab/XAPP_DT/Omnivers_platform/extensions:/app/extensions  # extensions live reload
      - /home/mitlab/XAPP_DT/Omnivers_platform/scene_config.json:/app/scene_config.json  # live config reload (overrides COPY'd version)
    ipc: host
    shm_size: 2gb
    restart: unless-stopped

volumes:
  postgres-data:
  frontend_node_modules:
  frontend_next_cache:
